name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Turn a missing `jj` into a hard failure instead of a silent test skip: the
  # sync/data-loss integration tests are jj-backed and must actually run in CI.
  JJJ_REQUIRE_JJ: "1"

jobs:
  check:
    # jjj supports macOS (primary) and Linux — exercise both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The jj-backed integration tests (push/fetch, concurrent writers) need a
      # real jj binary. Pin the version the code is validated against so a jj
      # release that changes CLI semantics can't silently break sync tests.
      - name: Install jujutsu (jj)
        uses: taiki-e/install-action@v2
        with:
          tool: jj@0.43.0
      - name: Configure jj identity
        run: |
          jj config set --user user.name "CI" || true
          jj config set --user user.email "ci@example.com" || true
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test
