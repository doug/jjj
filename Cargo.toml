[package]
name = "jjj"
version = "0.5.1"
edition = "2021"
rust-version = "1.82"
authors = ["jjj contributors"]
description = "Distributed project management and code review for Jujutsu"
license = "Apache-2.0"
repository = "https://github.com/doug/jjj"
homepage = "https://jjj.recursivewhy.com"
readme = "README.md"
keywords = ["jj", "jujutsu", "project-management", "code-review", "kanban"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
toml = "0.8"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"


# SQLite storage
rusqlite = { version = "0.31", features = ["bundled"] }


# UUID generation
uuid = { version = "1.11", features = ["v7"] }
pulldown-cmark = { version = "0.13.1", default-features = false, features = ["html"] }

# Derive FromStr+Display for snake_case/kebab-case enums
strum = { version = "0.26", features = ["derive"] }

# In-process semantic embeddings (Pillar 6). Heavy — only with `--features semantic`.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }

[features]
default = []
# In-process BERT sentence embeddings (candle): semantic search with no
# external server. Loads a model from a runtime path (see docs) — the repo
# and default build stay lean.
semantic = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

# Advisory file locking (flock) for the repo-wide write lock on unix.
# Already present in the dependency tree via rusqlite, so this adds no build cost.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.13"
regex = "1.10"

[lib]
name = "jjj"
path = "src/lib.rs"

[[bin]]
name = "jjj"
path = "src/main.rs"

[profile.release]
strip = true
lto = "thin"
